<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>shot3</title><link rel="stylesheet" href="shots.css">
<style>
  .steps { display: grid; gap: 18px; }
  .step { display: flex; gap: 18px; align-items: flex-start; padding: 18px 20px; border-radius: 14px; background: rgba(21,26,29,.85); border: 1px solid #262c31; }
  .num { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: #1d3a27; color: #22c55e; font-weight: 800; font-size: 18px; border: 1px solid #22c55e; }
  .step b { display: block; font-size: 20px; margin-bottom: 4px; }
  .step span { color: #a7b0b8; font-size: 16.5px; }
  .step kbd { font: 700 14px ui-monospace, Menlo, monospace; padding: 2px 8px; border-radius: 6px; background: #1c2226; border: 1px solid #2c343a; color: #f2f5f7; }
  .pill { display: inline-flex; align-items: center; gap: 9px; padding: 9px 15px 9px 12px; border-radius: 999px; background: rgba(16,18,20,.9); border: 1px solid rgba(255,255,255,.14); font-weight: 600; font-size: 15px; margin-top: 10px; }
  .pill i { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.25); }
  .pill small { color: rgba(255,255,255,.6); font-size: 15px; font-weight: 500; }
</style></head>
<body>
  <div class="wrap">
    <div>
      <h1>Ready in <em>three steps</em></h1>
      <div class="steps">
        <div class="step"><div class="num">1</div><div><b>Open play.xbox.com</b><span>Start any game in Chrome.</span></div></div>
        <div class="step"><div class="num">2</div><div><b>PadKey turns on</b><span>A virtual controller connects by itself.</span><br><span class="pill"><i></i>PadKey <small>· Racing</small></span></div></div>
        <div class="step"><div class="num">3</div><div><b>Play</b><span>Press <kbd>\</kbd> for shooter mode with mouse look, <kbd>`</kbd> to turn off.</span></div></div>
      </div>
    </div>
    <div class="frame zoom"><iframe src="popup-preview.html?mode=shooter" title="PadKey popup, shooter mode"></iframe></div>
  </div>
  <div class="foot">Not affiliated with Microsoft or Xbox.</div>
</body></html>
